<style>
  :root{ color-scheme:dark; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#04141A;
    background-image:radial-gradient(120% 80% at 50% -10%, #0A2A34 0%, #061C24 42%, #04141A 100%);
    background-attachment:fixed;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    color:#DCEEF0;
  }
  .wrap{max-width:860px;margin:0 auto;padding:clamp(16px,4vw,40px);}
  .mono{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .title{font-family:'Fraunces',serif;font-size:clamp(28px,7vw,40px);font-weight:600;letter-spacing:-0.02em;text-shadow:0 0 24px rgba(61,224,200,0.25);}
  .sub{color:#6E9AA0;font-size:14px;margin-top:2px;}
  .latest{text-align:right;font-size:13px;color:#6E9AA0;}
  .latest b{color:#DCEEF0;font-size:15px;font-weight:500;}

  .verdict{border-radius:18px;padding:clamp(20px,4vw,32px);margin-bottom:16px;}
  .vtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .dot{width:64px;height:64px;border-radius:50%;flex-shrink:0;}
  .vword{font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:0.14em;font-weight:600;}
  .vhead{font-family:'Fraunces',serif;font-size:clamp(26px,6vw,34px);font-weight:600;line-height:1.1;}
  .vbody{font-size:15px;line-height:1.6;margin:16px 0 0;max-width:560px;}
  .conf{display:inline-block;margin-top:14px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.04em;}
  .bigscore{font-family:'Fraunces',serif;font-size:clamp(58px,16vw,88px);font-weight:600;line-height:0.95;font-variant-numeric:tabular-nums;}
  .scoreout{font-size:18px;font-weight:600;opacity:0.5;}
  .scoreside{display:flex;flex-direction:column;justify-content:center;}

  .reason{background:#0A2028;border:1px solid #123845;border-radius:14px;padding:16px 18px;margin-bottom:16px;}
  .reason h3{margin:0 0 10px;font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:#DCEEF0;}
  .rline{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #0E2A34;font-size:13.5px;line-height:1.5;}
  .rline:last-child{border-bottom:none;}
  .rico{flex-shrink:0;width:18px;text-align:center;}
  .rup{color:#2FE6B0;} .rdown{color:#FF6B6B;} .rflat{color:#6E9AA0;} .rwarn{color:#E8B65A;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#0A2028;border:1px solid #123845;border-radius:12px;padding:14px 16px;}
  .slabel{font-size:11px;color:#6E9AA0;text-transform:uppercase;letter-spacing:0.05em;}
  .svalue{font-size:24px;font-weight:600;margin-top:4px;font-family:'Fraunces',serif;font-variant-numeric:tabular-nums;}
  .ssub{font-size:11.5px;color:#6E9AA0;margin-top:2px;font-variant-numeric:tabular-nums;}
  .ssrc{font-size:10px;color:#3D6B74;margin-top:3px;text-transform:uppercase;letter-spacing:0.06em;}

  .card{background:#0A2028;border:1px solid #123845;border-radius:14px;padding:18px;margin-bottom:16px;}
  .ctitle{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .cnote{color:#6E9AA0;font-size:12.5px;margin:2px 0 12px;line-height:1.5;}
  .cwrap{position:relative;width:100%;}

  .btn{border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;}
  .btn-primary{background:#3DE0C8;color:#04141A;box-shadow:0 0 20px -6px #3DE0C8;}
  .btn-ghost{background:transparent;color:#6E9AA0;border:1px solid #123845;font-weight:400;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;margin-bottom:8px;}

  .sync{display:flex;align-items:center;gap:10px;background:#0A2028;border:1px solid #123845;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#6E9AA0;}
  .sync .dotlive{width:8px;height:8px;border-radius:50%;background:#2FE6B0;box-shadow:0 0 8px #2FE6B0;flex-shrink:0;}
  .sync .dotoff{width:8px;height:8px;border-radius:50%;background:#E8B65A;flex-shrink:0;}
  .sync .doterr{width:8px;height:8px;border-radius:50%;background:#FF6B6B;flex-shrink:0;}

  .panel{background:#0A2028;border:1px solid #123845;border-radius:16px;padding:28px;}
  .foot{margin-top:24px;color:#6E9AA0;font-size:12px;line-height:1.6;border-top:1px solid #123845;padding-top:16px;}
  input[type=password],input[type=text]{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #123845;background:#0E2A34;color:#DCEEF0;font-size:15px;}
  label{font-size:13px;font-weight:600;color:#DCEEF0;display:block;margin-bottom:6px;}
  #boot{padding:40px 24px;color:#6E9AA0;font-size:14px;}

<body>
<div class="wrap" id="app"><div id="boot">Loading…</div></div>

<script>
(function(){
  "use strict";
  var boot=document.getElementById("boot");
  function fail(m){ if(boot) boot.textContent=m; }

  var C={ bg:"#04141A",panel:"#0A2028",panel2:"#0E2A34",line:"#123845",ink:"#DCEEF0",muted:"#6E9AA0",
    glow:"#3DE0C8",green:"#2FE6B0",greenSoft:"#0E3A38",amber:"#E8B65A",amberSoft:"#3A3018",
    yellow:"#E8B65A",yellowSoft:"#3A3018",
    red:"#FF6B6B",redSoft:"#3A1C22",hrv:"#57C7FF",hrvBand:"rgba(87,199,255,0.14)",r7:"#2FE6B0",r30:"#8A7DFF",oura:"#2FE6B0",temp:"#E8B65A" };

  // ==== YOUR RELAY ADDRESS ====
  var WORKER_URL="https://shiny-wind-c11d.mattfitzpatrick1994.workers.dev/";
  var GYM_URL="https://script.google.com/macros/s/AKfycbyIgdhH7JNT5N915Lj1UTbetvNieTz6JdcXV8vDygxwCY4hr5txxN7YDrxynEnzl-xp/exec";

  var K_ROWS="readiness_360hp_rows_v1", K_OURA="readiness_oura_cache_v1", K_OURATIME="readiness_oura_time_v1";
  var K_GYM="readiness_gym_cache_v1", K_GYMTIME="readiness_gym_time_v1", K_GYMSEL="readiness_gym_sel_v1";
  var K_TRAINDRAFT="readiness_train_draft_v1"; // auto-saved set values so backgrounding can't lose them
  var K_SCORELOCK="readiness_scorelock_v1"; // {iso: {score,band,comp,confidence}} — freezes the morning score for the day
  // draft key = week||day||exercise; stores {w:[4 weights], v:[4 vels], done:bool}
  function draftKey(week,day,exName){ return week+"||"+day+"||"+exName; }
  function getDraft(week,day,exName){ var all=getJSON(K_TRAINDRAFT,{}); return all[draftKey(week,day,exName)]||null; }
  function saveDraft(week,day,exName,patch){
    try{ var all=getJSON(K_TRAINDRAFT,{}); var k=draftKey(week,day,exName);
      all[k]=Object.assign({w:["","","",""],v:["","","",""],done:false}, all[k]||{}, patch);
      setJSON(K_TRAINDRAFT,all);
    }catch(e){}
  }
  function clearDraftFor(week,day){
    try{ var all=getJSON(K_TRAINDRAFT,{}); var pre=week+"||"+day+"||";
      Object.keys(all).forEach(function(k){ if(k.indexOf(pre)===0) delete all[k]; });
      setJSON(K_TRAINDRAFT,all);
    }catch(e){}
  }
  // Mark every past session found in the sheet history as "logged" in the app, so scrolling
  // back through the programme shows completed days as done (with the sheet's weights).
  // Runs on each sync; only ADDS logged flags, never clears anything he's currently typing.
  function backfillLoggedFromHistory(history){
    try{
      if(!history||!history.length) return;
      var all=getJSON(K_TRAINDRAFT,{});
      history.forEach(function(h){
        if(!h||!h.exercise) return;
        var wk=h.week||""; var day=h.day||h.dayLabel||""; // history may or may not carry a day label
        var sets=(h.sets||[]).map(function(x){ return (x==null?"":String(x)); });
        // a done session has at least one non-empty set cell (a weight or an X)
        var hasAny=sets.some(function(x){ return x!==""&&x!=="0"; });
        if(!hasAny) return;
        var w=[sets[0]||"",sets[1]||"",sets[2]||"",sets[3]||""];
        var k=wk+"||"+day+"||"+h.exercise;
        var existing=all[k];
        // don't overwrite something he's actively typing that ISN'T yet logged
        if(existing && !existing.logged && (existing.w||[]).some(function(x){return x&&x!=="";})) return;
        all[k]=Object.assign({v:["","","",""],done:true}, existing||{}, {w:w, logged:true, fromSheet:true});
      });
      setJSON(K_TRAINDRAFT,all);
    }catch(e){}
  }
  // Mark a day's just-logged exercises as completed, keeping their values.
  function markDayLogged(week,day,rows){
    try{
      (rows||[]).forEach(function(r){
        var w=[r.v1||"",r.v2||"",r.v3||"",r.v4||""];
        var v=[r.vel1||"",r.vel2||"",r.vel3||"",r.vel4||""];
        saveDraft(week, day, r.exercise, {w:w, v:v, logged:true, loggedAt:Date.now()});
      });
    }catch(e){}
  }
  // Snapshot EVERY training input to disk right now. Called on visibilitychange/pagehide —
  // the events iOS fires when you leave the app — so nothing is lost even if it suspends fast.
  function snapshotTrainingNow(){
    try{
      var ctx=window.__trainCtx; if(!ctx||!ctx.logInputs||!ctx.logInputs.length) return;
      ctx.logInputs.forEach(function(li){
        var w=["","","",""], v=["","","",""];
        for(var i=0;i<4;i++){ if(li.inputs&&li.inputs[i]) w[i]=li.inputs[i].value||""; if(li.vels&&li.vels[i]) v[i]=li.vels[i].value||""; }
        // only write if something was entered, so we don't clobber with blanks
        if(w.join("")!==""||v.join("")!==""){ saveDraft(ctx.week, ctx.day, li.exercise, {w:w, v:v}); }
      });
    }catch(e){}
  }
  if(typeof document!=="undefined" && !window.__trainSaveHooked){
    window.__trainSaveHooked=true;
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") snapshotTrainingNow(); });
    window.addEventListener("pagehide", snapshotTrainingNow);
    window.addEventListener("blur", snapshotTrainingNow);
  }
  var K_TOURN="readiness_tournament_v1", K_LOGHIST="readiness_loghist_v1", K_TRAVEL="readiness_travel_v1";
  var K_FLAGHIST="readiness_flaghist_v1"; // per-date record of tournament/travel flags
  var K_NOTES="readiness_notes_v1";       // per-date free-text notes
  // per-day flags: {tourn:bool, travel:""|"short"|"long"}
  function getFlags(iso){ var fh=getJSON(K_FLAGHIST,{}); return fh[iso]||{}; }
  function setFlag(iso,kind,val){
    try{
      var fh=getJSON(K_FLAGHIST,{});
      fh[iso]=fh[iso]||{};
      if(val===false||val===""||val==null) delete fh[iso][kind]; else fh[iso][kind]=val;
      if(!fh[iso].tourn && !fh[iso].travel) delete fh[iso];
      setJSON(K_FLAGHIST,fh);
    }catch(e){}
  }
  function getNote(iso){ var n=getJSON(K_NOTES,{}); return n[iso]||""; }
  function setNote(iso,txt){
    try{
      var n=getJSON(K_NOTES,{});
      if(txt&&txt.trim()) n[iso]=txt.trim(); else delete n[iso];
      setJSON(K_NOTES,n);
    }catch(e){}
  }

  // ===== TEAM SYNC — pushes your daily readiness up to Supabase for your team =====
  // Paste your two Supabase values here (same ones the team page uses).
  // Keys live in a separate config.js you set up ONCE (so app updates never touch them).
  // config.js should contain:  window.TEAM_CONFIG = { url:"https://xx: not the /rest/v1/ one", key:"your-publishable-key" };
  // ===== SOLO MODE: team sharing / login removed — this is a personal single-user app now. =====
  // Forcing the team client off makes every login gate, sync button and viewer path disappear,
  // because they're all guarded by teamConfigured()/isViewer(). The app runs in pure local mode.
  var TEAM_SUPABASE_URL = "";
  var TEAM_SUPABASE_ANON_KEY = "";
  var _teamSB = null;
  var _teamSynced={}, _teamUser=null;
  function teamConfigured(){ return false; }
  async function teamRefreshUser(){ _teamUser=null; return null; }
  // VIEWER ROLE — controls what this person can do in the app.
  // owner = full (Matt) · physio = view + notes · trainer = view + gym log · staff = view only · null = not signed in (treat as owner/local)
  var _teamRole=null;
  async function teamRefreshRole(){
    if(!_teamSB || !_teamUser){ _teamRole=null; return _teamRole; }
    _teamRole=null;
    // Primary: match by EMAIL (every login has one; no separate linking step to forget or break).
    try{
      var email=(_teamUser.email||"").toLowerCase().trim();
      if(email){
        var res=await _teamSB.from("team_members").select("role,active").ilike("email",email).maybeSingle();
        if(res && res.data && res.data.active) _teamRole=res.data.role;
      }
    }catch(e){}
    // Fallback: match by user_id if email lookup found nothing (covers rows linked the old way).
    if(!_teamRole){
      try{
        var r2=await _teamSB.from("team_members").select("role,active").eq("user_id",_teamUser.id).maybeSingle();
        if(r2 && r2.data && r2.data.active) _teamRole=r2.data.role;
      }catch(e2){}
    }
    return _teamRole;
  }
  // permission helpers — when NOT signed in at all, it's your private local app (full access)
  function isViewer(){ return !!(_teamSB && _teamUser && _teamRole && _teamRole!=="owner"); }
  function canEditOwn(){ return !isViewer(); }                 // 360HP import, flags, clear, notes-as-owner
  function canLogGym(){ return !isViewer() || _teamRole==="trainer"; }
  function canAddNotes(){ return !isViewer() || _teamRole==="physio"; }
  function roleLabel(){ return {owner:"Matt",physio:"Physio",trainer:"Trainer",staff:"Performance"}[_teamRole]||null; }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  // ===== VIEWER MODE: a physio/trainer/staff has no local data, so pull Matt's synced
  // days from Supabase and shape them EXACTLY like analyze() output so the UI just works.
  var VIEWER_MODEL=null, VIEWER_NOTES=[], VIEWER_GYM=[], VIEWER_LOADED=false;
  async function loadViewerData(){
    if(!_teamSB || !isViewer()){ VIEWER_MODEL=null; return; }
    try{
      var since=new Date(Date.now()-1000*60*60*24*400).toISOString().slice(0,10);
      var dr=await _teamSB.from("daily_readiness").select("*").gte("day",since).order("day",{ascending:true});
      var rows=dr.data||[];
      VIEWER_MODEL=rows.map(function(d){
        var band=d.band==="amber"?"yellow":d.band;
        return {
          iso:d.day, date:d.day, has:true,
          score100:d.score, band:band,
          reasons:d.reasons||[], confidence:d.confidence||"",
          hrv:d.hrv, hBase:d.hrv_base, hDev:(d.hrv!=null&&d.hrv_base)?(d.hrv-d.hrv_base)/d.hrv_base:null, hSd:null,
          rhr:d.rhr, rBase:d.rhr_base,
          roll7:(d.raw&&d.raw.roll7!=null)?d.raw.roll7:null, roll30:(d.raw&&d.raw.roll30!=null)?d.raw.roll30:null,
          comp:(d.raw&&d.raw.comp!=null)?d.raw.comp:0,
          hrvSrc:(d.raw&&d.raw.hrvSrc)?d.raw.hrvSrc:null,
          o_sleephrs:d.sleep_hours, o_sleepscore:d.sleep_score, o_tempdev:d.temp_dev,
          hp_subjective:d.subjective, hp_objective:d.objective, o_readiness:(d.raw&&d.raw.o_readiness!=null)?d.raw.o_readiness:null,
          tourn:d.tournament, travel:d.travel||"", appNote:""
        };
      });
      var sn=await _teamSB.from("session_notes").select("*").order("created_at",{ascending:false}).limit(50);
      VIEWER_NOTES=sn.data||[];
      var gl=await _teamSB.from("gym_logs").select("*").order("created_at",{ascending:false}).limit(50);
      VIEWER_GYM=gl.data||[];
    }catch(e){ VIEWER_MODEL=[]; }
    VIEWER_LOADED=true;
  }
  async function teamSignIn(email, password){
    if(!_teamSB){ alert("Team sync isn't set up yet."); return false; }
    if(!email||!password){ return false; }
    try{
      var { error } = await _teamSB.auth.signInWithPassword({ email:email, password:password });
      if(error){ alert(error.message); return false; }
      await teamRefreshUser(); return true;
    }catch(e){ alert("Sign-in failed: "+e.message); return false; }
  }
  async function teamSignOut(){ if(_teamSB){ try{ await _teamSB.auth.signOut(); }catch(e){} } _teamUser=null; render(false); }
  async function syncToTeam(model){
    if(!_teamSB) return {ok:false,msg:"Team sync not set up"};
    try{
      var r=await _teamSB.auth.getSession(); var session=r.data.session; if(!session) return {ok:false,msg:"Not signed in"};
      var rows=(model||[]).filter(function(d){return d.has&&d.iso;}).map(function(d){
        return { day:d.iso, score:d.score100!=null?Math.round(d.score100):null,
          band:d.band==="yellow"?"amber":d.band,
          action:d.band==="green"?"Push":d.band==="yellow"?"Moderate":"Recover",
          confidence:d.confidence||null, hrv:d.hrv!=null?d.hrv:null, hrv_base:d.hBase!=null?d.hBase:null,
          rhr:d.rhr!=null?d.rhr:null, rhr_base:d.rBase!=null?d.rBase:null,
          sleep_hours:d.o_sleephrs!=null?d.o_sleephrs:null, sleep_score:d.o_sleepscore!=null?d.o_sleepscore:null,
          subjective:d.hp_subjective!=null?d.hp_subjective:null, objective:d.hp_objective!=null?d.hp_objective:null,
          temp_dev:d.o_tempdev!=null?d.o_tempdev:null, tournament:!!d.tourn, travel:d.travel||"",
          reasons:d.reasons||[], raw:{hrvSrc:d.hrvSrc,roll7:d.roll7,roll30:d.roll30,comp:d.comp},
          updated_at:new Date().toISOString() };
      });
      if(!rows.length) return {ok:false,msg:"No data on this device to sync yet"};
      // upsert ALL rows (don't rely on the in-memory changed-cache, which hides failures)
      var { error } = await _teamSB.from("daily_readiness").upsert(rows,{onConflict:"day"});
      if(error){ return {ok:false,msg:(error.message||"database rejected the write")+" \u2014 check the daily_readiness write policy in Supabase"}; }
      set("readiness_team_lastsync", String(Date.now()));
      return {ok:true, count:rows.length};
    }catch(e){ return {ok:false,msg:e.message||"sync failed"}; }
  }

  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function getJSON(k,f){try{var s=localStorage.getItem(k);return s?JSON.parse(s):f;}catch(e){return f;}}
  function setJSON(k,v){set(k,JSON.stringify(v));}

  // ---------- helpers ----------
  function parseCSV(t){var L=t.trim().split(/\r?\n/);var H=L[0].split(",").map(function(h){return h.trim();});
    return L.slice(1).map(function(l){var p=l.split(",");var o={};H.forEach(function(h,i){o[h]=(p[i]!=null?p[i]:"").trim();});return o;});}
  function pDate(s){var p=s.split("-").map(Number);return new Date(p[2],p[1]-1,p[0]);}       // DD-MM-YYYY (360HP)
  function isoDate(d){return d.toISOString().slice(0,10);}                                    // YYYY-MM-DD
  function fmt(d){return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});}
  function median(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y;});var m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
  function mean(a){if(!a.length)return null;return a.reduce(function(x,y){return x+y;},0)/a.length;}
  function stdev(a){if(a.length<2)return null;var m=mean(a);return Math.sqrt(mean(a.map(function(v){return (v-m)*(v-m);})));}
  function pearson(xs,ys){var n=xs.length;if(n<4)return null;var mx=mean(xs),my=mean(ys),nu=0,dx=0,dy=0;
    for(var i=0;i<n;i++){var a=xs[i]-mx,b=ys[i]-my;nu+=a*b;dx+=a*a;dy+=b*b;}if(!dx||!dy)return null;return nu/Math.sqrt(dx*dy);}
  function r1(v){return v==null?null:Math.round(v*10)/10;}
  function r2(v){return v==null?null:Math.round(v*100)/100;}
  // least-squares best fit; returns {m,b} for y = m*x + b, or null
  function linreg(xs,ys){var n=xs.length;if(n<2)return null;var mx=mean(xs),my=mean(ys),num=0,den=0;
    for(var i=0;i<n;i++){var dx=xs[i]-mx;num+=dx*(ys[i]-my);den+=dx*dx;}if(!den)return null;
    var m=num/den;return {m:m,b:my-m*mx};}

  // ---------- data fusion ----------
  // Build a per-day map keyed by YYYY-MM-DD merging 360HP rows + Oura cache.
  function fuse(){
    var rows360=getJSON(K_ROWS,null);
    var oura=getJSON(K_OURA,null); // {readiness:[],daily_sleep:[],sleep_detail:{}}
    var days={};

    if(rows360){
      rows360.forEach(function(r){
        if(!r.date||!r.rMSSD) return;
        var iso=isoDate(pDate(r.date));
        days[iso]=days[iso]||{iso:iso};
        days[iso].hp_hrv=parseFloat(r.rMSSD);
        days[iso].hp_rhr=r.RHR?parseFloat(r.RHR):null;
        days[iso].hp_subjective=r.subjective?parseFloat(r.subjective):null;
        days[iso].hp_objective=r.objective?parseFloat(r.objective):null;
        days[iso].hp_sleep=r.sleep?parseFloat(r.sleep):null;
        days[iso].hp_energy=r.energy?parseFloat(r.energy):null;
        days[iso].hp_diet=r.diet?parseFloat(r.diet):null;
        days[iso].hp_exercise=r.exercise?parseFloat(r.exercise):null;
        days[iso].hp_happiness=r.happiness?parseFloat(r.happiness):null;
        days[iso].tags=(r.tags||"").trim(); days[iso].note=(r.note||"").trim();
      });
    }
    if(oura){
      (oura.readiness||[]).forEach(function(r){
        var d=days[r.day]=days[r.day]||{iso:r.day};
        d.o_readiness=r.score!=null?r.score:null;
        d.o_tempdev=r.temperature_deviation!=null?r.temperature_deviation:null;
        if(r.contributors){ d.o_hrvbal=r.contributors.hrv_balance; d.o_rhrcontrib=r.contributors.resting_heart_rate; }
      });
      (oura.daily_sleep||[]).forEach(function(r){
        var d=days[r.day]=days[r.day]||{iso:r.day};
        d.o_sleepscore=r.score!=null?r.score:null;
        // some relays put sleep duration on the daily_sleep record — grab it if present
        if(d.o_sleephrs==null){
          var h=null;
          if(r.total_sleep_hours!=null) h=r.total_sleep_hours;
          else if(r.total_sleep_duration!=null) h=r.total_sleep_duration/3600;
          else if(r.duration!=null) h=r.duration/3600;
          if(h!=null && isFinite(h) && h>0) d.o_sleephrs=Math.round(h*10)/10;
        }
      });
      var det=oura.sleep_detail||{};
      Object.keys(det).forEach(function(day){
        var d=days[day]=days[day]||{iso:day};
        d.o_hrv=det[day].average_hrv;          // raw ms — comparable to 360HP
        d.o_rhr=det[day].lowest_heart_rate!=null?det[day].lowest_heart_rate:det[day].average_heart_rate;
        // sleep hours: relay may send hours directly, or Oura's raw seconds under various names
        var sd=det[day];
        var hrs=null;
        if(sd.total_sleep_hours!=null) hrs=sd.total_sleep_hours;
        else if(sd.total_sleep_duration!=null) hrs=sd.total_sleep_duration/3600;   // Oura: seconds asleep
        else if(sd.total_sleep_seconds!=null) hrs=sd.total_sleep_seconds/3600;
        else if(sd.duration!=null) hrs=sd.duration/3600;
        else if(sd.time_in_bed!=null && sd.efficiency!=null) hrs=(sd.time_in_bed*(sd.efficiency/100))/3600;
        d.o_sleephrs=(hrs!=null && isFinite(hrs) && hrs>0)?Math.round(hrs*10)/10:(d.o_sleephrs!=null?d.o_sleephrs:null);
      });
    }
    // to sorted array
    var arr=Object.keys(days).sort().map(function(k){return days[k];});
    return arr;
  }

  // ============================================================================
  //  READINESS SIGNAL ENGINE v2  (ln rMSSD, SWC, per-source baselines, saturation,
  //  confidence-not-score for device disagreement, thin-data guards). Self-contained.
  // ============================================================================
  var RV2 = (function(){
  const ENGINE_VERSION = 2;

  const CONFIG = {
    weights: {
      hrvAcute:     0.30,
      hrvChronic:   0.08,
      hrvStability: 0.05,
      subjective:   0.30,
      rhr:          0.12,
      sleep:        0.09,
      ouraReady:    0.06
    },
    baselineDays:         7,
    chronicDays:         30,
    dispersionDays:      60,
    minBaselineReadings:  4,
    minDaysForSD:        14,
    swcMultiplier:      0.5,
    tanhSoftness:       2.0,
    saturationZ:        1.5,
    saturationRHR:       50,
    rhrCouplingAmp:     1.30,
    subjectiveRedFloor:   5.0,
    subjectiveAmberFloor: 6.5,
    deepSuppressionZ:    -2.0,
    severeSuppressionZ:  -3.0,
    tempFlagC:            0.5,
    illnessRhrZ:          1.0,
    illnessHrvZ:         -1.0,
    travelDecay: {
      short: [0.10, 0.05],
      long:  [0.22, 0.14, 0.07, 0.03]
    },
    sleepDebtNights: 3,
    sleepRegularityDays: 7,
    bands: { green: 59, red: 39 },
    agreementZGap: 1.25
  };

  const isNum = v => typeof v === 'number' && isFinite(v);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function mean(a) {
    const v = a.filter(isNum);
    return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
  }
  function median(a) {
    const v = a.filter(isNum).slice().sort((x, y) => x - y);
    if (!v.length) return null;
    const m = Math.floor(v.length / 2);
    return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
  }
  function sd(a) {
    const v = a.filter(isNum);
    if (v.length < 2) return null;
    const m = mean(v);
    return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1));
  }
  function robustSD(a) {
    const v = a.filter(isNum);
    if (v.length < 3) return null;
    const med = median(v);
    const devs = v.map(x => Math.abs(x - med));
    const m = median(devs);
    const r = m * 1.4826;
    return (r && r > 1e-9) ? r : sd(v);
  }
  function cv(a) {
    const m = mean(a), s = sd(a);
    return (isNum(m) && isNum(s) && Math.abs(m) > 1e-9) ? s / Math.abs(m) : null;
  }
  function squash(z, softness = CONFIG.tanhSoftness) {
    return Math.tanh(z / softness);
  }

  function priorDays(history, targetDate, n) {
    const before = history.filter(d => d.date < targetDate);
    return before.slice(-n);
  }
  function series(days, key, transform) {
    return days
      .map(d => (isNum(d[key]) && d[key] > 0 ? (transform ? transform(d[key]) : d[key]) : null))
      .filter(isNum);
  }
  const ln = x => Math.log(x);

  function buildBaseline(days, key, transform) {
    const shortWin = days.slice(-CONFIG.baselineDays);
    const dispWin  = days.slice(-CONFIG.dispersionDays);
    const shortVals = series(shortWin, key, transform);
    const dispVals  = series(dispWin,  key, transform);
    const center = median(shortVals);
    const spread = robustSD(dispVals);
    return {
      center, spread,
      n: shortVals.length, nRef: dispVals.length,
      swc: isNum(spread) ? spread * CONFIG.swcMultiplier : null,
      valid: isNum(center) && shortVals.length >= CONFIG.minBaselineReadings,
      spreadReliable: isNum(spread) && dispVals.length >= CONFIG.minDaysForSD
    };
  }
  function zScore(value, baseline) {
    if (!isNum(value) || !baseline || !isNum(baseline.center)) return null;
    if (!isNum(baseline.spread) || baseline.spread < 1e-9) return null;
    return (value - baseline.center) / baseline.spread;
  }

  function componentHrvAcute(today, hist) {
    const sources = [
      { key: 'hp_hrv', label: '360HP', val: today.hp_hrv },
      { key: 'o_hrv',  label: 'Oura',  val: today.o_hrv  }
    ];
    for (const src of sources) {
      if (!isNum(src.val) || src.val <= 0) continue;
      const base = buildBaseline(hist, src.key, ln);
      if (!base.valid) continue;
      const z = zScore(ln(src.val), base);
      if (!isNum(z)) continue;
      const zEff = Math.min(z, CONFIG.saturationZ);
      const score = squash(zEff);
      const meaningful = isNum(base.swc) && Math.abs(ln(src.val) - base.center) > base.swc;
      return {
        available: true, score, z, source: src.label, meaningful,
        note: meaningful
          ? `${src.label} HRV ${z >= 0 ? 'above' : 'below'} baseline by more than the smallest worthwhile change`
          : `${src.label} HRV within normal day-to-day noise`
      };
    }
    return { available: false, score: 0, z: null, note: 'No usable HRV today' };
  }

  function componentHrvChronic(today, hist) {
    const key = series(priorDays(hist, today.date, 7), 'hp_hrv', ln).length >= 4
      ? 'hp_hrv' : 'o_hrv';
    const w7  = series(priorDays(hist, today.date, CONFIG.baselineDays), key, ln);
    const w30 = series(priorDays(hist, today.date, CONFIG.chronicDays),  key, ln);
    if (w7.length < 4 || w30.length < CONFIG.minDaysForSD) {
      return { available: false, score: 0, z: null, note: 'Not enough history for a trend' };
    }
    const m7 = mean(w7), m30 = mean(w30);
    const spread = robustSD(w30);
    if (!isNum(spread) || spread < 1e-9) {
      return { available: false, score: 0, z: null, note: 'Trend dispersion unavailable' };
    }
    const z = (m7 - m30) / spread;
    return {
      available: true, score: squash(z, 1.0), z,
      note: z >= 0 ? 'Weekly HRV above the monthly norm' : 'Weekly HRV below the monthly norm'
    };
  }

  function componentHrvStability(today, hist) {
    const recent = series(priorDays(hist, today.date, CONFIG.baselineDays), 'hp_hrv', ln);
    const refDays = priorDays(hist, today.date, CONFIG.dispersionDays);
    if (recent.length < 5 || refDays.length < CONFIG.dispersionDays / 2) {
      return { available: false, score: 0, z: null, note: 'Not enough data for HRV stability' };
    }
    const cvNow = cv(recent);
    if (!isNum(cvNow)) return { available: false, score: 0, z: null, note: 'CV unavailable' };
    const hist7cvs = [];
    for (let i = CONFIG.baselineDays; i <= refDays.length; i++) {
      const w = series(refDays.slice(i - CONFIG.baselineDays, i), 'hp_hrv', ln);
      if (w.length >= 5) { const c = cv(w); if (isNum(c)) hist7cvs.push(c); }
    }
    if (hist7cvs.length < 10) {
      return { available: false, score: 0, z: null, note: 'Not enough history for CV norm' };
    }
    const cvBase = median(hist7cvs), cvSpread = robustSD(hist7cvs);
    if (!isNum(cvSpread) || cvSpread < 1e-9) {
      return { available: false, score: 0, z: null, note: 'CV norm unavailable' };
    }
    const z = (cvNow - cvBase) / cvSpread;
    const rhrNow = isNum(today.o_rhr) ? today.o_rhr : today.hp_rhr;
    const saturationPlausible = isNum(rhrNow) && rhrNow <= CONFIG.saturationRHR;
    let score = 0, note = 'HRV day-to-day variation is normal';
    if (z > 1.0) {
      score = -squash(z - 1.0, 1.5) * 0.8;
      note = 'HRV is bouncing around more than usual - stress may be accumulating';
    } else if (z < -1.5 && saturationPlausible) {
      score = -squash(Math.abs(z) - 1.5, 1.5) * 0.6;
      note = 'HRV has gone unusually flat at a low heart rate - watch for overreaching';
    }
    return { available: true, score, z, note };
  }

  function componentSubjective(today, hist) {
    const v = today.hp_subjective;
    if (!isNum(v)) {
      return { available: false, score: 0, z: null, note: 'No subjective rating today' };
    }
    const base = buildBaseline(priorDays(hist, today.date, CONFIG.dispersionDays), 'hp_subjective');
    const absScore = clamp((v - 6.5) / 3.0, -1, 1);
    let relScore = null;
    const z = base.valid ? zScore(v, base) : null;
    if (isNum(z)) relScore = squash(z);
    const score = isNum(relScore) ? (0.55 * absScore + 0.45 * relScore) : absScore;
    return { available: true, score: clamp(score, -1, 1), z, note: `You rated yourself ${v}/10` };
  }

  function componentRhr(today, hist, hrvZ) {
    const sources = [
      { key: 'hp_rhr', label: '360HP', val: today.hp_rhr },
      { key: 'o_rhr',  label: 'Oura',  val: today.o_rhr  }
    ];
    for (const src of sources) {
      if (!isNum(src.val) || src.val <= 0) continue;
      const base = buildBaseline(hist, src.key);
      if (!base.valid) continue;
      const z = zScore(src.val, base);
      if (!isNum(z)) continue;
      let score = -squash(z);
      let coupled = false;
      if (isNum(hrvZ) && hrvZ < -0.5 && z > 0.5) {
        score *= CONFIG.rhrCouplingAmp;
        coupled = true;
      }
      return {
        available: true, score: clamp(score, -1, 1), z, source: src.label, coupled,
        note: coupled
          ? `Resting HR up while HRV is down (${src.label}) - these agree`
          : `Resting HR ${z >= 0 ? 'above' : 'below'} your ${src.label} baseline`
      };
    }
    return { available: false, score: 0, z: null, note: 'No resting HR today' };
  }

  function componentSleep(today, hist) {
    const refDays = priorDays(hist, today.date, CONFIG.dispersionDays);
    const hoursHist = series(refDays, 'o_sleep_hours');
    const parts = [];
    if (hoursHist.length >= CONFIG.minDaysForSD && isNum(today.o_sleep_hours)) {
      const need = median(hoursHist);
      const recent = [today, ...priorDays(hist, today.date, CONFIG.sleepDebtNights - 1)]
        .map(d => d.o_sleep_hours).filter(isNum);
      if (recent.length) {
        const debt = recent.reduce((s, h) => s + Math.max(0, need - h), 0);
        parts.push({ w: 0.6, s: clamp(-debt / 3.0, -1, 0.15) });
      }
    }
    const mids = series(priorDays(hist, today.date, CONFIG.sleepRegularityDays), 'o_sleep_midpoint');
    const midsRef = series(refDays, 'o_sleep_midpoint');
    if (mids.length >= 5 && midsRef.length >= CONFIG.minDaysForSD) {
      const nowSD = sd(mids);
      const refSDs = [];
      for (let i = CONFIG.sleepRegularityDays; i <= refDays.length; i++) {
        const w = series(refDays.slice(i - CONFIG.sleepRegularityDays, i), 'o_sleep_midpoint');
        if (w.length >= 5) { const s = sd(w); if (isNum(s)) refSDs.push(s); }
      }
      if (isNum(nowSD) && refSDs.length >= 10) {
        const b = median(refSDs), sp = robustSD(refSDs);
        if (isNum(sp) && sp > 1e-9) {
          parts.push({ w: 0.2, s: clamp(-squash((nowSD - b) / sp), -1, 0.5) });
        }
      }
    }
    if (isNum(today.o_sleep_score)) {
      parts.push({ w: 0.2, s: clamp((today.o_sleep_score - 75) / 20, -1, 1) });
    }
    if (!parts.length) {
      return { available: false, score: 0, z: null, note: 'No sleep data' };
    }
    const wSum = parts.reduce((s, p) => s + p.w, 0);
    const score = parts.reduce((s, p) => s + p.w * p.s, 0) / wSum;
    return {
      available: true, score: clamp(score, -1, 1), z: null,
      note: score < -0.25 ? 'Sleep is running short or irregular'
          : score >  0.25 ? 'Sleep has been solid'
          : 'Sleep is around normal'
    };
  }

  function componentOuraReadiness(today) {
    if (!isNum(today.o_readiness)) {
      return { available: false, score: 0, z: null, note: 'No Oura readiness' };
    }
    return {
      available: true, score: clamp((today.o_readiness - 70) / 20, -1, 1), z: null,
      note: `Oura readiness ${Math.round(today.o_readiness)}`
    };
  }

  function travelPenalty(today, hist) {
    const lookback = [...priorDays(hist, today.date, 5), today];
    let worst = 0, label = null;
    lookback.forEach((d, i) => {
      const daysSince = lookback.length - 1 - i;
      const mode = d.travel;
      if (!mode || mode === 'none') return;
      const decay = CONFIG.travelDecay[mode];
      if (!decay) return;
      const idx = daysSince - 1;
      if (idx < 0 || idx >= decay.length) return;
      if (decay[idx] > worst) { worst = decay[idx]; label = mode; }
    });
    return { penalty: worst, mode: label };
  }

  function buildFlags(today, comps, travel) {
    const flags = [];
    const hrvZ = comps.hrvAcute.z;
    const rhrZ = comps.rhr.z;
    const tags = (today.noteTags || []).map(t => String(t).toLowerCase());
    if (isNum(today.o_temp_dev) && today.o_temp_dev >= CONFIG.tempFlagC &&
        isNum(rhrZ) && rhrZ >= CONFIG.illnessRhrZ &&
        isNum(hrvZ) && hrvZ <= CONFIG.illnessHrvZ) {
      flags.push({ type: 'illness', cap: 'red',
        message: 'Temperature, resting HR and HRV are all moving the wrong way together - treat as possible illness' });
    } else if (isNum(today.o_temp_dev) && today.o_temp_dev >= CONFIG.tempFlagC) {
      flags.push({ type: 'temp', cap: 'amber',
        message: `Body temperature ${today.o_temp_dev.toFixed(1)}C above your normal` });
    }
    if (isNum(today.hp_subjective)) {
      if (today.hp_subjective <= CONFIG.subjectiveRedFloor) {
        flags.push({ type: 'subjective', cap: 'red',
          message: 'You rated yourself low enough that nothing else overrides it' });
      } else if (today.hp_subjective <= CONFIG.subjectiveAmberFloor) {
        flags.push({ type: 'subjective', cap: 'amber',
          message: 'Subjective rating is below your working threshold' });
      }
    }
    if (isNum(hrvZ) && hrvZ <= CONFIG.severeSuppressionZ) {
      flags.push({ type: 'hrv', cap: 'red',
        message: 'HRV is more than 3 SD below baseline - nothing else outweighs this' });
    } else if (isNum(hrvZ) && hrvZ <= CONFIG.deepSuppressionZ) {
      flags.push({ type: 'hrv', cap: 'amber',
        message: 'HRV is more than 2 SD below baseline - deep suppression' });
    }
    const rhrNow = isNum(today.o_rhr) ? today.o_rhr : today.hp_rhr;
    if (isNum(hrvZ) && hrvZ > CONFIG.saturationZ &&
        isNum(rhrNow) && rhrNow <= CONFIG.saturationRHR) {
      flags.push({ type: 'saturation', cap: null,
        message: 'HRV is well above baseline at a very low heart rate - read this as neutral, not as a green light' });
    }
    if (tags.some(t => /pain|injur|sore|ill|sick|cold|flu/.test(t))) {
      flags.push({ type: 'note', cap: 'amber',
        message: 'You logged pain or illness in your note' });
    }
    if (travel.mode === 'long' && travel.penalty >= 0.14) {
      flags.push({ type: 'travel', cap: 'amber',
        message: 'Long-haul travel is still in your system' });
    }
    return flags;
  }

  function buildConfidence(comps, coverage, hist, today) {
    const reasons = [];
    let level = 3;
    const days = priorDays(hist, today.date, CONFIG.dispersionDays).length;
    if (days < CONFIG.baselineDays)      { level = 0; reasons.push('Baseline is still building'); }
    else if (days < CONFIG.minDaysForSD) { level = Math.min(level, 1); reasons.push('Fewer than two weeks of baseline'); }
    else if (days < 28)                  { level = Math.min(level, 2); reasons.push('Under four weeks of baseline'); }
    if (coverage < 0.6) { level = Math.min(level, 1); reasons.push('Several inputs missing today'); }
    else if (coverage < 0.85) { level = Math.min(level, 2); reasons.push('Some inputs missing today'); }
    if (isNum(today.hp_hrv) && isNum(today.o_hrv)) {
      const zHp = zScore(ln(today.hp_hrv), buildBaseline(hist, 'hp_hrv', ln));
      const zOu = zScore(ln(today.o_hrv),  buildBaseline(hist, 'o_hrv',  ln));
      if (isNum(zHp) && isNum(zOu) && Math.abs(zHp - zOu) > CONFIG.agreementZGap) {
        level = Math.min(level, 1);
        reasons.push('Your strap and ring disagree today - one reading may be poor quality');
      }
    }
    return { level: ['low', 'moderate', 'good', 'high'][level], reasons };
  }

  function computeReadiness(today, history, overrides) {
    const cfg = Object.assign({}, CONFIG, overrides || {});
    const hist = (history || [])
      .filter(d => d && d.date && d.date < today.date)
      .sort((a, b) => a.date.localeCompare(b.date));
    const hrvAcute = componentHrvAcute(today, hist);
    const comps = {
      hrvAcute,
      hrvChronic:   componentHrvChronic(today, hist),
      hrvStability: componentHrvStability(today, hist),
      subjective:   componentSubjective(today, hist),
      rhr:          componentRhr(today, hist, hrvAcute.z),
      sleep:        componentSleep(today, hist),
      ouraReady:    componentOuraReadiness(today)
    };
    let availableWeight = 0, weighted = 0;
    const breakdown = [];
    for (const key of Object.keys(cfg.weights)) {
      const w = cfg.weights[key];
      const c = comps[key];
      if (c.available) { availableWeight += w; weighted += w * c.score; }
      breakdown.push({
        key, weight: w, available: c.available,
        score: c.available ? Number(c.score.toFixed(3)) : null,
        z: isNum(c.z) ? Number(c.z.toFixed(2)) : null,
        note: c.note, source: c.source || null
      });
    }
    const hasFreshInput = [today.hp_hrv, today.o_hrv, today.hp_subjective,
                           today.hp_rhr, today.o_rhr, today.o_sleep_hours,
                           today.o_readiness].some(v => isNum(v) && v > 0);
    const coverage = availableWeight;
    if (!hasFreshInput || availableWeight < 0.2) {
      return {
        engineVersion: ENGINE_VERSION, score: null, band: 'unknown', action: 'No data',
        comp: null, coverage, components: breakdown, flags: [],
        confidence: { level: 'low', reasons: ['Not enough inputs to score today'] },
        why: ['Not enough data today to produce a signal.']
      };
    }
    let comp = weighted / availableWeight;
    const travel = travelPenalty(today, hist);
    if (travel.penalty > 0) comp -= travel.penalty;
    comp = clamp(comp, -1, 1);
    let score = Math.round(50 + 50 * comp);
    score = clamp(score, 0, 100);
    let band = score >= cfg.bands.green ? 'green'
             : score >= cfg.bands.red   ? 'amber'
             : 'red';
    const flags = buildFlags(today, comps, travel);
    const rank = { green: 2, amber: 1, red: 0 };
    for (const f of flags) {
      if (!f.cap) continue;
      if (rank[f.cap] < rank[band]) {
        band = f.cap;
        const ceiling = f.cap === 'amber' ? cfg.bands.green - 1 : cfg.bands.red - 1;
        score = Math.min(score, ceiling);
      }
    }
    const action = band === 'green' ? 'Push' : band === 'amber' ? 'Moderate' : 'Recover';
    const confidence = buildConfidence(comps, coverage, hist, today);

    // Guard against over-confident calls on thin data: pull the score toward neutral (50)
    // when the baseline isn't established or coverage is low. A day the engine can't stand
    // behind should read "moderate / still learning", never a confident green or red.
    // Caps from hard flags are exempt — an illness/subjective red must survive this.
    const capBands = flags.filter(f => f.cap).map(f => f.cap);
    const hasRedCap = capBands.indexOf('red') >= 0;
    const hasAmberCap = capBands.indexOf('amber') >= 0;
    if (!hasRedCap && !hasAmberCap) {
      const shrinkByConf = { low: 0.35, moderate: 0.6, good: 0.85, high: 1.0 }[confidence.level];
      const shrinkByCov  = clamp(coverage / 0.85, 0.2, 1);
      const shrink = Math.min(shrinkByConf, shrinkByCov);
      if (shrink < 1) {
        score = Math.round(50 + (score - 50) * shrink);
        band = score >= cfg.bands.green ? 'green' : score >= cfg.bands.red ? 'amber' : 'red';
      }
    }
    const actionFinal = band === 'green' ? 'Push' : band === 'amber' ? 'Moderate' : 'Recover';

    // A "green / push" call should rest on broad agreement, not a single strong input.
    // If coverage is thin, the best a positive day can read is amber ("moderate").
    let bandGuarded = band, scoreGuarded = score;
    if (band === 'green' && coverage < 0.55 && !hasRedCap) {
      bandGuarded = 'amber';
      scoreGuarded = Math.min(score, cfg.bands.green - 1);
    }
    band = bandGuarded; score = scoreGuarded;
    const actionGuarded = band === 'green' ? 'Push' : band === 'amber' ? 'Moderate' : 'Recover';
    const why = breakdown
      .filter(b => b.available)
      .map(b => ({ ...b, contribution: Math.abs(b.weight * b.score) }))
      .sort((a, b) => b.contribution - a.contribution)
      .map(b => b.note);
    flags.forEach(f => why.unshift(f.message));
    if (travel.penalty > 0) {
      why.push(`${travel.mode === 'long' ? 'Long-haul' : 'Short-haul'} travel is still being counted against today`);
    }
    if (coverage < 0.99) {
      const missing = breakdown.filter(b => !b.available).map(b => b.key);
      why.push(`Scored on the inputs available (missing: ${missing.join(', ')})`);
    }
    return {
      engineVersion: ENGINE_VERSION,
      score, band, action: actionGuarded,
      comp: Number(comp.toFixed(3)),
      coverage: Number(coverage.toFixed(2)),
      components: breakdown, flags, confidence, travel, why
    };
  }

  function recomputeAll(allDays) {
    const sorted = (allDays || []).slice().sort((a, b) => a.date.localeCompare(b.date));
    return sorted.map((day, i) => ({

  // Map an app day-row (from fuse) to the engine's expected input shape.
  function toEngineDay(row){
    return {
      date: row.iso,
      hp_hrv: (row.hp_hrv!=null?row.hp_hrv:null),
      o_hrv:  (row.o_hrv!=null?row.o_hrv:null),

      o_sleep_hours: (row.o_sleephrs!=null?row.o_sleephrs:null),

    };
  }

  // v2-powered analyze: keeps the exact output contract the UI already consumes.
  function analyze(arr){
    var engineDays = arr.map(toEngineDay);
    return arr.map(function(row,i){
      var hist = engineDays.slice(0,i);          // engine only looks at prior days
      var res;
      try {
        res = RV2.compute(engineDays[i], hist);
      } catch(err) {
        // never let a single malformed day take down the whole render
        res = { score:null, band:"yellow", comp:0, components:[], flags:[], why:[], confidence:{level:"low"} };
      }
      if(!res || typeof res!=="object") res = { score:null, band:"yellow", comp:0, components:[], flags:[], why:[], confidence:{level:"low"} };

      // pull component detail for the fields the UI still shows directly
      function comp(k){ for(var j=0;j<res.components.length;j++){ if(res.components[j].key===k) return res.components[j]; } return null; }
      var cAc = comp('hrvAcute')||{};

      // recover the display HRV/RHR + baselines (median on the natural scale, for the stat cards)
      var prior=arr.slice(Math.max(0,i-7),i);
      function hrvOf(d){ return d.hp_hrv!=null?d.hp_hrv:(d.o_hrv!=null?d.o_hrv:null); }
      var hrv=hrvOf(row), hrvSrc=row.hp_hrv!=null?"360HP":(row.o_hrv!=null?"Oura":null);
      var hpv=prior.map(hrvOf).filter(function(v){return v!=null&&isFinite(v);});
      var hBase=hpv.length>=3?median(hpv):null, hSd=hpv.length>=3?stdev(hpv):null;
      var hDev=(hBase&&hrv!=null)?(hrv-hBase)/hBase:null;
      var rhr=row.hp_rhr!=null?row.hp_rhr:(row.o_rhr!=null?row.o_rhr:null);
      var rp=prior.map(function(d){return d.hp_rhr!=null?d.hp_rhr:d.o_rhr;}).filter(function(v){return v!=null&&isFinite(v);});
      var rBase=rp.length>=3?median(rp):null;
      var w7=arr.slice(Math.max(0,i-6),i+1).map(hrvOf).filter(function(v){return v!=null&&isFinite(v);});
      var w30=arr.slice(Math.max(0,i-29),i+1).map(hrvOf).filter(function(v){return v!=null&&isFinite(v);});
      var roll7=w7.length>=3?mean(w7):null, roll30=w30.length>=5?mean(w30):null;

      // Build plain-language, number-rich reasons from the engine's components +
      // the raw values — v1's readability with v2's maths underneath.
      var reasons=[];
      function compOf(k){ for(var j=0;j<res.components.length;j++){ if(res.components[j].key===k) return res.components[j]; } return null; }
      function zWord(z,invert){ // invert=true means "up is bad" (RHR)
        var a=Math.abs(z);
        var lowSide = invert ? z>0 : z<0;
        if(a<0.5) return "in your normal range";
        if(lowSide) return a>=2?"well below your normal range":a>=1?"below your normal range":"slightly below normal";
        return a>=2?"well above your normal range":a>=1?"above your normal range":"slightly above normal";
      }

      // HRV — the anchor line, always shown when present
      var cAc=compOf('hrvAcute');
      if(hrv!=null&&hBase!=null){
        var pct=Math.round(hDev*100);
        var hz=(cAc&&cAc.z!=null)?cAc.z:null;
        var word=hz!=null?zWord(hz,false):"";
        reasons.push({dir: hz!=null&&hz<-0.5?"down":hz!=null&&hz>0.5?"up":"flat",
          txt:"HRV "+Math.round(hrv)+" ms \u2014 "+(pct>=0?"+":"")+pct+"% vs your 7-day normal of "+Math.round(hBase)+" ms"+(word?", "+word:"")+(hrvSrc?" ("+hrvSrc+")":"")});
      }

      // Subjective
      if(row.hp_subjective!=null){
        var cs=compOf('subjective');
        var sdir=cs&&cs.score>0.2?"up":cs&&cs.score<-0.2?"down":"flat";
        reasons.push({dir:sdir, txt:"You rated yourself "+row.hp_subjective+"/10"+
          (row.hp_subjective<=5?" \u2014 low enough that it holds today down on its own":
           row.hp_subjective<=6.5?" \u2014 a bit below par":
           row.hp_subjective>=8.5?" \u2014 feeling strong":"")});
      }

      // Weekly vs monthly trend
      var cCh=compOf('hrvChronic');
      if(cCh&&cCh.available&&roll7!=null&&roll30!=null){
        var tPct=Math.round((roll7/roll30-1)*100);
        if(Math.abs(tPct)>=3){
          reasons.push({dir:cCh.score>0.15?"up":cCh.score<-0.15?"down":"flat",
            txt:"Your last 7 days average "+(tPct>=0?"+":"")+tPct+"% vs your last 30 \u2014 "+
                (tPct<=-5?"fatigue building up over time":tPct>=5?"trending fresher than usual":"steady over time")});
        }
      }

      // Resting HR
      var cR=compOf('rhr');
      if(rhr!=null&&rBase!=null){
        var rdiff=Math.round(rhr-rBase);
        var rz=(cR&&cR.z!=null)?cR.z:null;
        if(Math.abs(rdiff)>=1){
          reasons.push({dir: cR&&cR.score>0.2?"up":cR&&cR.score<-0.2?"down":"flat",
            txt:"Resting HR "+Math.round(rhr)+" bpm \u2014 "+(rdiff>0?"+"+rdiff:rdiff)+" vs your 7-day normal of "+Math.round(rBase)+" bpm"+
                (cR&&cR.coupled?" (up while HRV is down \u2014 these agree, a real fatigue sign)":
                 rdiff>=3?" (a rise usually means fatigue or something brewing)":
                 rdiff<=-3?" (lower than usual \u2014 a good sign)":"")});
        }
      }

      // Sleep hours
      if(row.o_sleephrs!=null){
        var cSl=compOf('sleep');
        if(cSl&&cSl.available&&(cSl.score<-0.2||cSl.score>0.25)){
          reasons.push({dir:cSl.score>0?"up":"down",
            txt:"Slept "+(Math.round(row.o_sleephrs*10)/10)+" h \u2014 "+(cSl.score<0?"below":"in line with")+" your usual"});
        }
      }

      // Oura readiness — only when it's actually saying something
      if(row.o_readiness!=null&&(row.o_readiness>=85||row.o_readiness<68)){
        reasons.push({dir:row.o_readiness>=85?"up":"down",
          txt:"Oura scored your readiness "+row.o_readiness+"/100"+(row.o_readiness>=85?" \u2014 strong":" \u2014 low")});
      }

      // Hard-cap flags from the engine, translated to plain language, shown FIRST
      var flagLines=[];
      (res.flags||[]).forEach(function(f){
        var msg=f.message;
        if(f.type==="illness") msg="Body temp, resting HR and HRV are all moving the wrong way together \u2014 treat as possible illness and hold back";
        else if(f.type==="temp") msg="Body temp above your normal overnight \u2014 often the first sign of illness or heavy stress";
        else if(f.type==="hrv"&&/3 SD/.test(f.message)) msg="HRV is deeply suppressed \u2014 well below your normal range, so today is capped at recover";
        else if(f.type==="hrv") msg="HRV is well below your normal range \u2014 today is held to moderate at best";
        else if(f.type==="subjective"&&/nothing else/.test(f.message)) msg="You rated yourself low enough that it holds today down whatever the devices say";
        else if(f.type==="subjective") msg="Your rating is below par \u2014 today is capped at moderate at best";
        else if(f.type==="saturation") msg="A big HRV spike at a very low heart rate \u2014 read this as neutral, not a green light";
        else if(f.type==="note") msg="You flagged pain or illness in your note \u2014 pushing toward recovery";
        else if(f.type==="travel") msg="Long-haul travel is still in your system";
        flagLines.push({dir:"warn", txt:msg});
      });

      // Device disagreement note (confidence, not score) if the engine set it
      if(res.confidence&&res.confidence.reasons){
        res.confidence.reasons.forEach(function(rr){
          if(/disagree/.test(rr)) flagLines.push({dir:"warn", txt:"Your strap and ring disagree today \u2014 one reading may be off, so lean on this a little less"});
        });
      }

      reasons = flagLines.concat(reasons);
      if(!reasons.length) reasons.push({dir:"flat", txt:"Not enough data yet today to explain \u2014 add more history."});

      // band -> keep the app's yellow naming
      var band = res.band==="amber" ? "yellow" : res.band;
      var score100 = res.score!=null ? res.score : 0;

      // FREEZE today's score: a readiness score is a morning reading and must not drift during
      // the day as Oura re-syncs or the baseline shifts. The first score computed for a given
      // date is locked and reused all day. (Past days are historical and never locked here.)
      var _todayIso=new Date().toISOString().slice(0,10);
      if(row.iso===_todayIso && res.score!=null){
        try{
          var locks=getJSON(K_SCORELOCK,{});
          if(locks[_todayIso] && locks[_todayIso].score!=null){
            // reuse the locked morning values
            score100=locks[_todayIso].score;
            if(locks[_todayIso].band) band=locks[_todayIso].band;
          } else {
            // first compute of the day — lock it
            locks={}; // keep only today's lock, drop old dates
            locks[_todayIso]={score:score100, band:band, comp:(res.comp!=null?res.comp:0), confidence:(res.confidence?res.confidence.level:"low")};
            setJSON(K_SCORELOCK,locks);
          }
        }catch(e){}
      }

      return Object.assign({},row,{
        hrv:hrv,hrvSrc:hrvSrc,hBase:hBase,hSd:hSd,hDev:hDev,
        rhr:rhr,rBase:rBase,roll7:roll7,roll30:roll30,
        comp:res.comp!=null?res.comp:0, score100:score100, band:band,
        reasons:reasons, confidence:(res.confidence?res.confidence.level:"low"),
        v2:res, has:(hrv!=null||row.hp_hrv!=null||row.o_hrv!=null||row.hp_subjective!=null),
        travel:(getFlags((function(){var d=new Date(row.iso+"T00:00:00");d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);})()).travel)||"",
        tourn:!!getFlags(row.iso).tourn, appNote:getNote(row.iso)});
    });
  }

    red:{w:"RED",h:"Recover",b:"Signals are down. Rest, mobility, or light recovery. Pushing today digs the hole deeper."} };

  // ---- B3 mini-ring helper: value vs baseline -> status colour + ring fill fraction ----
  // dir: "high"=higher is better (HRV, sleep, readiness, subjective), "low"=lower is better (resting HR)
  // Returns {col, frac(0..1), sub}. Status: green good / amber neutral / red poor, vs the person's own normal.
  function miniRing(val, base, dir, fracHint){
    if(val==null) return {col:C.muted, frac:0, empty:true};
    var col=C.muted, frac=(fracHint!=null?fracHint:0.5);
    if(base!=null && base!==0){
      var rel=(val-base)/base;                 // relative to own normal
      if(dir==="low") rel=-rel;                 // for RHR, lower is better
      // within ±3% = neutral(amber-muted), better than +3% = green, worse than -3% = red
      if(rel>=0.03) col=C.green; else if(rel<=-0.06) col=C.red; else if(rel<=-0.03) col=C.amber; else col=C.hrv;
      frac=Math.max(0.06,Math.min(1,0.5+rel*3));

  }

    if(!GYM_URL || GYM_URL.indexOf("http")!==0){ cb({error:"No gym URL set"}); return; }
    var attempt=_attempt||1;

      clearTimeout(to);

  function buildTrends(container,model){

    var rowsB=model.filter(function(d){return d.has;});
    var labels=rowsB.map(function(d){return fmt(new Date(d.iso));});

    var hpHRV=rowsB.map(function(d){return d.hp_hrv!=null?d.hp_hrv:null;});
    var hpRHR=rowsB.map(function(d){return d.hp_rhr!=null?d.hp_rhr:null;});
    // rolling helpers over a null-tolerant array
    function rollMed(arr,i,w){var v=[];for(var k=Math.max(0,i-w+1);k<=i;k++){if(arr[k]!=null)v.push(arr[k]);}return v.length>=3?median(v):null;}
    function rollMean(arr,i,w){var v=[];for(var k=Math.max(0,i-w+1);k<=i;k++){if(arr[k]!=null)v.push(arr[k]);}return v.length>=3?mean(v):null;}
    function rollSD(arr,i,w){var v=[];for(var k=Math.max(0,i-w+1);k<=i;k++){if(arr[k]!=null)v.push(arr[k]);}return v.length>=3?stdev(v):null;}
    var hpBase=hpHRV.map(function(_,i){return rollMed(hpHRV,i,7);});
    var hpBaseR1=hpBase.map(r1);
    var hp7=hpHRV.map(function(_,i){return rollMean(hpHRV,i,7);});
    var hp30=hpHRV.map(function(_,i){return rollMean(hpHRV,i,30);});
    var hpSD=hpHRV.map(function(_,i){return rollSD(hpHRV,i,7);});

    // HRV (360HP) as bars with the rolling baseline line over them

        {type:"line",label:"baseline",data:hpBaseR1,borderColor:C.amber,borderWidth:2,borderDash:[5,4],pointRadius:0,tension:0.3,order:1,spanGaps:true}
      ]},options:baseOpts(deepMerge({},LEG))}));})();

    var up=hpHRV.map(function(_,i){return (hpBase[i]!=null&&hpSD[i]!=null)?r1(hpBase[i]+hpSD[i]):null;});
    var lo=hpHRV.map(function(_,i){return (hpBase[i]!=null&&hpSD[i]!=null)?r1(hpBase[i]-hpSD[i]):null;});
    lineChart(container,"HRV trend with variability band","360HP HRV only. Shaded band is your normal swing (\u00b11 SD). Breaking below it = a real dip, not noise.",labels,[
      {label:"upper",data:up,borderColor:"transparent",backgroundColor:C.hrvBand,pointRadius:0,fill:"+1",spanGaps:true},
      {label:"lower",data:lo,borderColor:"transparent",backgroundColor:C.hrvBand,pointRadius:0,fill:false,spanGaps:true},
      {label:"HRV (360HP)",data:hpHRV.map(r1),borderColor:C.hrv,borderWidth:2.4,pointRadius:0,tension:0.3,spanGaps:true}

    lineChart(container,"Rolling 7-day vs 30-day HRV","360HP HRV only. When the fast line dips below the slow line, fatigue is building before you feel it.",labels,[
      {label:"7-day",data:hp7.map(r1),borderColor:C.r7,borderWidth:2.4,pointRadius:0,tension:0.35,spanGaps:true},
      {label:"30-day",data:hp30.map(r1),borderColor:C.r30,borderWidth:2.4,pointRadius:0,tension:0.35,spanGaps:true}

    // daily score bars
    (function(){var cd=card("Daily readiness score","0\u2013100 from all sources fused. Green \u2265 59, amber 39\u201358, red < 39. Dotted line is your 7-day average.");
      var cv=mkCanvas(cd,200);container.appendChild(cd);
      var sc=rowsB.map(function(d){return d.score100;});
      var scRoll=sc.map(function(_,i){var w=[];for(var k=Math.max(0,i-6);k<=i;k++){if(sc[k]!=null)w.push(sc[k]);}return w.length?Math.round(mean(w)):null;});
      CHARTS.push(new Chart(cv,{data:{labels:labels,datasets:[
        {type:"bar",label:"score",data:sc,backgroundColor:rowsB.map(function(d){return C[d.band];}),borderRadius:3,order:2},
        {type:"line",label:"7-day avg",data:scRoll,borderColor:C.ink,borderWidth:2,borderDash:[5,4],pointRadius:0,tension:0.3,order:1,spanGaps:true}
      ]},options:baseOpts(deepMerge({scales:{y:{min:0,max:100}}},LEG))}));})();

    // resting HR (360HP only) — bars with dotted rolling avg + ±1SD band, gaps where none
    var hasRhr=hpRHR.filter(function(v){return v!=null;}).length>=2;
    if(hasRhr){
      var rAvg=hpRHR.map(function(_,i){return r1(rollMean(hpRHR,i,7));});
      var rUp=hpRHR.map(function(_,i){var m=rollMean(hpRHR,i,7),sd=rollSD(hpRHR,i,7);return (m!=null&&sd!=null)?r1(m+sd):null;});
      var rLo=hpRHR.map(function(_,i){var m=rollMean(hpRHR,i,7),sd=rollSD(hpRHR,i,7);return (m!=null&&sd!=null)?r1(m-sd):null;});
      var cdR=card("Resting heart rate","360HP resting HR only. Bars are daily; dotted line is your 7-day average; shaded band is \u00b11 SD. A jump above the band can signal fatigue or illness.");

        {type:"line",label:"upper",data:rUp,borderColor:"transparent",backgroundColor:"rgba(255,107,107,0.10)",pointRadius:0,fill:"+1",order:3,spanGaps:true},
        {type:"line",label:"lower",data:rLo,borderColor:"transparent",backgroundColor:"rgba(255,107,107,0.10)",pointRadius:0,fill:false,order:3,spanGaps:true},
        {type:"bar",label:"resting HR (360HP)",data:hpRHR,backgroundColor:C.red+"55",borderColor:C.red,borderWidth:1,borderRadius:3,order:2},

  function buildCompare(container,model){
    destroyCharts();
    if(!chartsReady()){noChart(container);return;}
    var both=model.filter(function(d){return d.hp_hrv!=null&&d.o_hrv!=null;});
    if(both.length<2){
      needSync(container,"This tab compares your 360HP HRV against Oura's raw HRV side by side. It needs the updated Oura relay (v2) deployed so Oura's raw HRV comes through \u2014 once that's live and synced, these charts fill in.");
      return;
    }
    var lbl=both.map(function(d){return fmt(new Date(d.iso));});
    lineChart(container,"360HP vs Oura HRV","Both raw HRV (ms) on the same days. Close lines = your sources agree; gaps = they diverge.",lbl,[
      {label:"360HP",data:both.map(function(d){return r1(d.hp_hrv);}),borderColor:C.hrv,borderWidth:2.4,pointRadius:2,tension:0.3},
      {label:"Oura",data:both.map(function(d){return r1(d.o_hrv);}),borderColor:C.oura,borderWidth:2.4,pointRadius:2,tension:0.3}
    ],LEG);

    // difference bars
    (function(){var cd=card("Daily difference (360HP \u2212 Oura)","How far apart your two HRV sources are each day. Bars near zero = strong agreement.");
      var cv=mkCanvas(cd,200);container.appendChild(cd);
      CHARTS.push(new Chart(cv,{type:"bar",data:{labels:lbl,datasets:[
        {label:"diff (ms)",data:both.map(function(d){return r1(d.hp_hrv-d.o_hrv);}),backgroundColor:both.map(function(d){var x=Math.abs(d.hp_hrv-d.o_hrv);return x<8?C.green:x<18?C.amber:C.red;}),borderRadius:3}
      ]},options:baseOpts()}));})();

    // scatter agreement
    (function(){var cd=card("Agreement scatter","Each dot is a day. The dashed line is the best fit \u2014 the closer dots sit to it, the more your two devices agree.");
      var cv=mkCanvas(cd,240);container.appendChild(cd);
      var pts=both.map(function(d){return {x:r1(d.o_hrv),y:r1(d.hp_hrv)};});
      var datasets=[{type:"scatter",label:"day",data:pts,backgroundColor:C.glow,pointRadius:4}];
      var fit=linreg(both.map(function(d){return d.o_hrv;}),both.map(function(d){return d.hp_hrv;}));
      if(fit){
        var xsv=both.map(function(d){return d.o_hrv;});
        var xmin=Math.min.apply(null,xsv), xmax=Math.max.apply(null,xsv);
        datasets.push({type:"line",label:"best fit",
          data:[{x:r1(xmin),y:r1(fit.m*xmin+fit.b)},{x:r1(xmax),y:r1(fit.m*xmax+fit.b)}],
          borderColor:C.amber,borderWidth:2,borderDash:[6,4],pointRadius:0,fill:false});
      }
      CHARTS.push(new Chart(cv,{data:{datasets:datasets},
        options:baseOpts({scales:{x:{type:"linear",title:{display:true,text:"Oura HRV",color:C.muted}},y:{title:{display:true,text:"360HP HRV",color:C.muted}}}})}));})();

    var r=pearson(both.map(function(d){return d.o_hrv;}),both.map(function(d){return d.hp_hrv;}));
    if(r!=null){var ins=document.createElement("div");ins.className="insight";
      ins.innerHTML="<b>Correlation r = "+r.toFixed(2)+".</b> "+(Math.abs(r)>0.6?"Your two HRV sources track each other closely \u2014 they broadly agree.":Math.abs(r)>0.3?"Moderate agreement \u2014 they move together somewhat but diverge on individual days.":"Weak agreement \u2014 the two devices often tell different stories on a given day, which is exactly why the app leans cautious when they disagree.");
      container.appendChild(ins);}
  }

  function buildInsights(container,model){
    destroyCharts();
    if(!chartsReady()){noChart(container);return;}
    var rowsB=model.filter(function(d){return d.has;});
    if(rowsB.length<4){needSync(container,"Insights need a bit more history. Import your full 360HP CSV and sync Oura, then check back.");return;}

    // (the "Does 360HP sleep predict your HRV?" scatter moved to the new 360HP tab)

    // ---- Option D: rolling sleep vs rolling HRV scatter, dots shaded by time + best fit ----
    (function(){
      var hasHrs=model.filter(function(d){return d.o_sleephrs!=null;}).length;
      if(hasHrs>=4){
        var sleepRoll=[], hrvRoll=[];
        for(var i=0;i<model.length;i++){
          var sW=[], hW=[];
          for(var k=Math.max(0,i-6);k<=i;k++){
            if(model[k].o_sleephrs!=null) sW.push(model[k].o_sleephrs);
            if(model[k].hrv!=null) hW.push(model[k].hrv);
          }
          sleepRoll.push(sW.length?mean(sW):null);
          hrvRoll.push(hW.length?mean(hW):null);
        }
        var pts=[], idx=[];
        for(var j=0;j<model.length;j++){ if(sleepRoll[j]!=null&&hrvRoll[j]!=null){ pts.push({x:r1(sleepRoll[j]),y:r1(hrvRoll[j])}); idx.push(j); } }
        if(pts.length>=4){
          // colour dots dark->bright by recency (older = muted blue, newer = bright glow)
          var cols=idx.map(function(_,i){var t=pts.length>1?i/(pts.length-1):1;
            // interpolate hrv-blue (#3A6B8C-ish) -> glow (#3DE0C8)
            function mix(a,b,t){return Math.round(a+(b-a)*t);}
            var r=mix(0x3A,0x3D,t),g=mix(0x6B,0xE0,t),b=mix(0x8C,0xC8,t);
            return "rgb("+r+","+g+","+b+")";});
          var fit=linreg(pts.map(function(p){return p.x;}),pts.map(function(p){return p.y;}));
          var rr=pearson(pts.map(function(p){return p.x;}),pts.map(function(p){return p.y;}));
          var note="Each dot is one week (rolling avg). Dots brighten from oldest to newest \u2014 if the bright ones sit up-and-right, you're trending toward more sleep and higher HRV.";
          if(rr!=null) note+=" r = "+rr.toFixed(2)+(Math.abs(rr)>0.5?" \u2014 they track closely.":Math.abs(rr)>0.25?" \u2014 a moderate link.":" \u2014 a weak link for you.");
          var cd=card("Sleep vs HRV \u2014 does more sleep lift it?",note);
          var cv=mkCanvas(cd,240);container.appendChild(cd);
          var ds=[{type:"scatter",label:"week",data:pts,backgroundColor:cols,pointRadius:5}];
          if(fit){var xmin=Math.min.apply(null,pts.map(function(p){return p.x;})),xmax=Math.max.apply(null,pts.map(function(p){return p.x;}));
            ds.push({type:"line",label:"best fit",data:[{x:r1(xmin),y:r1(fit.m*xmin+fit.b)},{x:r1(xmax),y:r1(fit.m*xmax+fit.b)}],borderColor:C.amber,borderWidth:2,borderDash:[6,4],pointRadius:0,fill:false});}
          CHARTS.push(new Chart(cv,{data:{datasets:ds},options:baseOpts({scales:{
            x:{type:"linear",title:{display:true,text:"7-day avg sleep (hrs)",color:C.muted}},
            y:{title:{display:true,text:"7-day avg HRV",color:C.muted}}}})}));
        }
      } else {
        needSync(container,"Sleep vs HRV charts appear here once Oura sleep-hours data is flowing (needs the v2 relay deployed).");
      }
    })();

    // ---- Option E: how much you slept -> next-day HRV vs your average ----
    (function(){
      // pair each night's sleep hours with NEXT day's HRV, expressed vs the mean HRV
      var pairs=[];
      for(var i=0;i<model.length-1;i++){
        if(model[i].o_sleephrs!=null && model[i+1].hrv!=null) pairs.push({sleep:model[i].o_sleephrs, nextHrv:model[i+1].hrv});
      }
      if(pairs.length>=4){

        var vals=buckets.map(function(b){
          var hv=pairs.filter(function(p){return p.sleep>=b.lo&&p.sleep<b.hi;}).map(function(p){return p.nextHrv;});
          return hv.length?r1(mean(hv)-mH):null;

        // only show if at least 2 buckets have data

          ]},options:baseOpts({scales:{y:{title:{display:true,text:"HRV vs your average",color:C.muted},grid:{color:function(ctx){return ctx.tick.value===0?C.muted:C.line;}}}}})}));

    // Oura sleep vs next-day HRV correlation insight

      var ds2=[{type:"scatter",label:"day",data:pairs,backgroundColor:C.oura,pointRadius:4}];

      if(fit2){var xs2=pairs.map(function(p){return p.x;});var x2min=Math.min.apply(null,xs2),x2max=Math.max.apply(null,xs2);
        ds2.push({type:"line",label:"best fit",data:[{x:x2min,y:r1(fit2.m*x2min+fit2.b)},{x:x2max,y:r1(fit2.m*x2max+fit2.b)}],borderColor:C.amber,borderWidth:2,borderDash:[6,4],pointRadius:0,fill:false});}
      CHARTS.push(new Chart(cv2,{data:{datasets:ds2},
        options:baseOpts({scales:{x:{type:"linear",title:{display:true,text:"prev-night sleep",color:C.muted}},y:{title:{display:true,text:"HRV",color:C.muted}}}})}));

    // what predicts good vs bad days: compare avg metrics on green vs red days

    function avg(list,key){var v=list.map(function(d){return d[key];}).filter(function(x){return x!=null&&isFinite(x);});return v.length?mean(v):null;}
    if(greens.length>=2&&reds.length>=2){
      var ins=document.createElement("div");ins.className="insight";
      var gSleep=avg(greens,"hp_sleep"),rSleep=avg(reds,"hp_sleep");

      var gSubj=avg(greens,"hp_subjective"),rSubj=avg(reds,"hp_subjective");
      var lines=["<b>What your good vs bad days look like</b> ("+greens.length+" green, "+reds.length+" red so far):"];
      if(gSubj!=null&&rSubj!=null) lines.push("\u2022 Subjective: "+gSubj.toFixed(1)+" on green days vs "+rSubj.toFixed(1)+" on red");
      if(gRhr!=null&&rRhr!=null) lines.push("\u2022 Resting HR: "+Math.round(gRhr)+" on green vs "+Math.round(rRhr)+" on red");
      if(gSleep!=null&&rSleep!=null) lines.push("\u2022 Sleep score: "+gSleep.toFixed(1)+" on green vs "+rSleep.toFixed(1)+" on red");
      ins.innerHTML=lines.join("<br>");

    // weekly summary: last 7 days band counts + trend
    var last7=rowsB.slice(-7);

      var g=last7.filter(function(d){return d.band==="green";}).length;

        wc.appendChild(tr);}
      container.appendChild(wc);
    }

    // ---- Training load vs recovery (from locally-logged sessions) ----
    var loghist=getJSON(K_LOGHIST,[]);
    if(loghist.length>=2 && chartsReady()){
      // aggregate weekly training volume by ISO date -> sum of top weights that day
      var byDate={};
      loghist.forEach(function(l){ if(!l.date) return; byDate[l.date]=(byDate[l.date]||0)+(l.topWeight||0); });
      var dates=Object.keys(byDate).sort();
      if(dates.length>=2){
        // align HRV roll7 to those dates from model
        var hrvByDate={}; model.forEach(function(d){ if(d.roll7!=null) hrvByDate[d.iso]=r1(d.roll7); });
        var cd=card("Training load vs recovery","Bars = training load that day (sum of top set weights). Line = your 7-day HRV trend. When load climbs while the line falls, you're outrunning recovery.");
        var cv=mkCanvas(cd,230);container.appendChild(cd);
        var lbl=dates.map(function(x){return fmt(new Date(x));});
        CHARTS.push(new Chart(cv,{type:"bar",data:{labels:lbl,datasets:[
          {type:"bar",label:"load (kg)",data:dates.map(function(x){return Math.round(byDate[x]);}),backgroundColor:C.amber+"88",borderRadius:3,yAxisID:"y"},
          {type:"line",label:"HRV 7-day",data:dates.map(function(x){return hrvByDate[x]!=null?hrvByDate[x]:null;}),borderColor:C.hrv,borderWidth:2.4,pointRadius:0,tension:0.3,spanGaps:true,yAxisID:"y1"}
        ]},options:baseOpts(deepMerge({scales:{y:{position:"left",title:{display:true,text:"load",color:C.muted}},y1:{position:"right",grid:{drawOnChartArea:false},title:{display:true,text:"HRV",color:C.muted}}}},LEG))}));

        ]},options:baseOpts(deepMerge({scales:{y:{position:"left",title:{display:true,text:"m/s",color:C.muted}},y1:{position:"right",grid:{drawOnChartArea:false},title:{display:true,text:"kg",color:C.muted}}}},LEG))}));
      }
    } else if(chartsReady()){
      needSync(container,"Bar-speed trends appear here once you've logged velocity for a lift a few times. Tracking bar speed at a given load is elite-level fatigue monitoring \u2014 a speed drop flags fatigue early.");
    }
  }

  // ---------- Training tab (gym sheet) ----------
  var gymStatus={state:"idle",msg:""};
  // strip the "A1)" style prefix and normalise an exercise name for matching
  function normEx(s){return (s||"").toLowerCase().replace(/^[a-z]\d*\)\s*/,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();}
  function fuzzyMatch(a,b){
    if(!a||!b) return false;
    if(a===b) return true;
    if(a.indexOf(b)>=0||b.indexOf(a)>=0) return true;
    var aw=a.split(" ").filter(function(w){return w.length>2;});
    var bw=b.split(" ");
    if(!aw.length) return false;
    var shared=aw.filter(function(w){return bw.indexOf(w)>=0;}).length;

  // find the most recent PRIOR week (from sheet history) where this exercise was done.
  // currentOrder = the tab order of the week being viewed, so we only look further back.
  function findPrevLift(exName,currentOrder){
    var gym=getJSON(K_GYM,null);
    var hist=(gym&&gym.history)?gym.history:[];
    if(!hist.length) return null;
    var target=normEx(exName);
    if(!target) return null;
    var matches=hist.filter(function(l){
      if(currentOrder!=null && l.order!=null && l.order>=currentOrder) return false; // only earlier weeks
      return fuzzyMatch(target,normEx(l.exercise));
    });
    if(!matches.length) return null;
    // most recent prior = highest order (falls back to last in list)
    matches.sort(function(a,b){ return (b.order||0)-(a.order||0); });
    var m=matches[0];
    // map sheet 'sets' (H-K strings) to the weights array the UI expects
    return {exercise:m.exercise, week:m.week, date:m.date, weights:m.sets||[], vels:null};
  }
  // resolve the current week's tab order from the loaded programme (for the "prior only" filter)
  function weekOrder(weekName){
    var gym=getJSON(K_GYM,null);
    var hist=(gym&&gym.history)?gym.history:[];
    for(var i=0;i<hist.length;i++){ if(hist[i].week===weekName && hist[i].order!=null) return hist[i].order; }
    return null;
  }

    // --- THE SCORE ---
    section("How the readiness score is calculated");

      faqWeightRow("How you feel (subjective)","30%",C.glow)+

      faqWeightRow("HRV \u2014 7-day vs 30-day trend","8%",C.hrv)+
      faqWeightRow("Sleep","9%",C.ink)+

      faqWeightRow("Oura readiness","6%",C.glow)+

      "<div style='margin-top:12px;font-size:13px;color:"+C.muted+"'>HRV in total is your biggest input (43% across its three parts), then how you feel (30%). That's deliberate \u2014 HRV is the most objective recovery signal you have, but how you actually feel is given equal top billing so the number never overrides your own judgement.</div>"

    qa("What do the colours mean?",
      "The score maps to three bands:<br><br>"+

      "<b style='color:"+C.amber+"'>Amber (39\u201358) \u2014 Moderate.</b> Middle ground; technical or moderate work, leave max effort for a green day.<br><br>"+
      "<b style='color:"+C.red+"'>Red (0\u201338) \u2014 Recover.</b> Signals are down; rest, mobility, or light recovery.");

    qa("Is the score trend-based or just today?",
      "Mostly trend-based. HRV, resting HR and the Oura pieces are all measured against your <b>rolling baseline</b>, not absolute values \u2014 so ~70% of the score reflects how you're tracking versus your own recent normal. The ~30% \u201chow you feel\u201d part is deliberately today-only.");
    qa("Does travel or a tournament change the score?",
