    qa("Is this medical or validated against golf performance?",
      "No. It's a <b>signal, not a diagnosis</b>. It fuses your trends to suggest how hard to go \u2014 it doesn't replace how you feel or medical advice. No composite readiness score (this, Oura's, or Whoop's) is validated to predict golf performance; the weights are reasoned from sports-science research, not fitted to your results.");

    // --- WHY IT'S BUILT THIS WAY ---
    section("Why the score is built this way");
    card(
      "This wasn't a generic template \u2014 every choice was made for <b>your</b> setup: a 360HP morning HRV reading, an Oura ring, a daily self-rating, and a golf calendar with travel and tournaments. Here's the reasoning behind the big decisions."
    );
    qa("Why HRV is the anchor",
      "Heart-rate variability is the most established objective marker of autonomic recovery \u2014 how ready your nervous system is to absorb hard work. HRV-guided training research (Kiviniemi and Vesterinen among others) has repeatedly shown that athletes who train hard when HRV is at or above their normal, and back off when it's suppressed, improve more than those following a fixed plan. That's exactly what this score is doing for you, which is why HRV across its three parts is the largest single input.",true);
    qa("Why we use YOUR baseline, not normal ranges",
      "There's no universal \u201cgood\u201d HRV number \u2014 healthy values vary enormously between people. What matters is change against your own recent normal. So everything is scored relative to your rolling 7-day baseline. A reading that's high for you is a green signal even if it would be low for someone else. This is the standard approach in the HRV literature and in Oura/Whoop/HRV4Training.");
    qa("Why the baseline is 7 days",
      "A rolling 7-day window is the sports-science standard (Plews, Buchheit et al.). It's long enough to filter out single-night noise \u2014 one bad sleep won't wreck your baseline \u2014 but short enough to track your current state and adapt after a hard block or a time-zone change. A 14-day window is steadier but lags too much after travel, which matters a lot for you. You also get a 7-vs-30-day trend line so you can see the bigger direction.");
    qa("Why raw HRV is handled carefully (ln rMSSD)",
      "Raw rMSSD is mathematically skewed, so simple averages and percentage thresholds on it are misleading. The engine works on the natural-log of rMSSD and flags meaningful change using the <b>smallest worthwhile change</b> (half your own variability) rather than an arbitrary cutoff \u2014 both are the methods the research (Plews et al.) recommends for exactly this. It means a \u201cgreen\u201d genuinely means today is beyond your day-to-day noise, not just slightly up.");
    qa("Why \u201chow you feel\u201d carries as much weight as HRV",
      "Self-report captures things sensors miss \u2014 niggles, illness coming on, life stress, mental freshness. The research (Saw et al., 2016) found subjective wellbeing often tracks training response as well as or better than objective markers. So your morning rating is weighted equal-top with HRV, and a low rating can veto an otherwise green day. The number should never tell you to push when you know you're cooked.");
    qa("Why resting HR and Oura are cross-checks, not co-stars",
      "Resting HR is a genuine fatigue and illness signal, but it moves less and later than HRV, so it's a supporting 12%. Oura's own readiness is useful as a second opinion \u2014 when it agrees with your 360HP HRV, confidence rises; when they disagree, the app leans cautious rather than picking a winner. Importantly, your two HRV sources are read against separate baselines, because Oura's night-time HRV and 360HP's morning HRV aren't the same measurement.");
    qa("Why travel lowers the score but tournaments don't",
      "A long-haul flight is a real physiological hit \u2014 dehydration, broken sleep, immobility, time-zone disruption \u2014 and you've had travel-induced HRV troughs before, so travel (flagged for the day before) adds caution to the number. A tournament isn't a recovery event, so it doesn't move the score; instead it reshapes the guidance toward arriving fresh. Both were tuned to your actual workflow: fly Friday, read Saturday morning, tag the flight as yesterday.");
    qa("Why it protects you on thin-data days",
      "Two safeguards were added specifically so the score can't mislead you: a brand-new or sparse setup is pulled toward the neutral middle instead of flashing a confident green before it knows your normal, and a genuinely good day still needs enough data behind it to reach green. The score would rather say \u201cnot sure\u201d than tell you to push on a hunch.");
    qa("What it deliberately does NOT do",
      "It doesn't claim to predict your golf score \u2014 no readiness metric is validated for that. It doesn't diagnose illness. And it doesn't override you: it's a fast, honest read on your recovery trend to inform how hard to train, with your own judgement always the final call.");

    // --- THE MEASURES ---
    section("What each measure means");
    qa("HRV (heart rate variability)",
      "The variation between heartbeats, measured each morning (raw rMSSD). <b>Higher is generally better</b> \u2014 it reflects a recovered, parasympathetic-ready nervous system. It's your single most important recovery signal here. Shown against your 7-day normal; the ring is green when you're above it, red when well below.",true);
    qa("Resting HR",
      "Your resting heart rate. <b>Lower and stable is good;</b> a jump above your normal often flags fatigue, illness, or incomplete recovery. The ring is inverted \u2014 below your normal shows green.");
    qa("Subjective",
      "Your own morning self-rating out of 10 (from 360HP). It carries real weight (30%) because how you feel captures things a sensor can't. Rating yourself \u22645 caps the day at red, \u22646.5 caps at amber \u2014 your gut can veto a good-looking number.");
    qa("Oura readiness",
      "Oura's own daily readiness score out of 100, pulled automatically. Used as a supporting cross-check (6%) alongside your 360HP data. When it agrees with your HRV, confidence goes up; when it disagrees, the app leans cautious.");
    qa("Oura sleep",
      "Oura's nightly sleep-quality score out of 100 \u2014 how well you slept, not just how long.");
    qa("Sleep time",

    qa("Body temperature",
      "Your temperature deviation from normal (\u00b0C), from Oura. A spike of +0.5\u00b0C or more can flag illness or heavy stress and pushes the score toward caution \u2014 you'll see it called out on the Oura tab.");
    qa("HRV trend & stability",
      "Two smaller HRV pieces: <b>trend</b> compares your last 7 days to your last 30 (is your recovery climbing or sliding?), and <b>stability</b> looks at how steady your HRV is day to day. Wild swings themselves signal incomplete recovery.");

    // --- SOURCES ---
    section("Where the data comes from");
    card(
      "<b style='color:"+C.hrv+"'>360HP</b> \u2014 your morning HRV, resting HR and self-ratings (imported CSV). This is the accuracy anchor.<br><br>"+
      "<b style='color:"+C.glow+"'>Oura</b> \u2014 sleep, temperature, and Oura's readiness, pulled automatically each day.<br><br>"+
      "When both have HRV, the app uses 360HP as the anchor and Oura as a cross-check. Missing a source just means those rings show \u201c\u2014\u201d that day; the score still works from what's there."
    );

  // ---- export today's summary as a shareable PNG (drawn on a canvas, no libraries) ----
  function exportTodayImage(today, btn){
    try{
      if(!today || !today.has){ alert("No reading yet today to export."); return; }
      if(btn) btn.textContent="Creating\u2026";
      var W=1080, S=2;
      var band=today.band, bc=(band==="green"?C.green:band==="red"?C.red:C.amber);
      var reasons=(today.reasons||[]).filter(function(r){return r&&r.txt;});

      // ---- measure phase: figure out total height from wrapped text, before drawing ----
      var mcv=document.createElement("canvas"); var mx=mcv.getContext("2d");
      function wrapLines(ctx,text,maxW){ var words=String(text).split(" "),line="",out=[]; for(var i=0;i<words.length;i++){ var t=line+words[i]+" "; if(ctx.measureText(t).width>maxW && line){ out.push(line.trim()); line=words[i]+" "; } else line=t; } if(line.trim())out.push(line.trim()); return out; }

      var topBlock=880;            // header + ring + action + verdict
      var metricsBlock=210;        // metric cards row
      var reasonsHeaderH=70;
      // measure each reason's wrapped height
      mx.font="400 30px Inter, Arial, sans-serif";
      var reasonLineH=42, reasonPad=26, reasonGap=16;
      var reasonHeights=reasons.map(function(r){ var lines=wrapLines(mx,r.txt,W-70-70-70); return Math.max(1,lines.length)*reasonLineH + reasonPad*2; });
      var reasonsTotal=reasonsHeaderH + reasonHeights.reduce(function(a,b){return a+b+reasonGap;},0);
      var footerBlock=150;
      var H=topBlock+metricsBlock+reasonsTotal+footerBlock;

      // ---- draw phase ----
      var cv=document.createElement("canvas"); cv.width=W*S; cv.height=H*S;
      var x=cv.getContext("2d"); x.scale(S,S);
      var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#062430"); g.addColorStop(0.4,C.bg); g.addColorStop(1,"#031016");
      x.fillStyle=g; x.fillRect(0,0,W,H);

      // header
      x.textAlign="left";
      x.fillStyle=C.ink; x.font="600 46px Fraunces, Georgia, serif"; x.fillText("Readiness", 70, 96);
      x.fillStyle=C.muted; x.font="500 24px 'IBM Plex Mono', monospace";
      var dstr=new Date(today.iso+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
      x.fillText(dstr.toUpperCase(), 70, 134);

      // score ring
      var cx=W/2, cy=400, r=175;
      x.lineWidth=26; x.lineCap="round";
      x.strokeStyle="#0E2A34"; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke();
      var frac=Math.max(0.02,Math.min(1,(today.score100||0)/100));
      x.strokeStyle=bc; x.shadowColor=bc; x.shadowBlur=34;
      x.beginPath(); x.arc(cx,cy,r,-Math.PI/2, -Math.PI/2 + frac*Math.PI*2); x.stroke(); x.shadowBlur=0;
      x.textAlign="center";
      x.fillStyle=bc; x.font="600 150px Fraunces, Georgia, serif"; x.fillText(String(today.score100), cx, cy+42);
      x.fillStyle=bc; x.font="600 30px 'IBM Plex Mono', monospace";
      x.fillText((band==="green"?"READY":band==="red"?"RECOVER":"MODERATE"), cx, cy+108);

      // action pill
      var act=(band==="green"?"\u25b2 Push today":band==="red"?"\u25bc Recover today":"Moderate today");
      x.font="600 30px Inter, Arial, sans-serif";
      var pw=x.measureText(act).width+72, ph=64, ppx=cx-pw/2, ppy=cy+150;
      roundRect(x,ppx,ppy,pw,ph,32); x.fillStyle=bc; x.fill();
      x.fillStyle="#04141A"; x.fillText(act, cx, ppy+42);

      // verdict
      x.fillStyle=C.muted; x.font="400 27px Inter, Arial, sans-serif";
      var vtext=(band==="green"?"Recovered and holding above your normal \u2014 a good day to load.":band==="red"?"Signals are down \u2014 rest, mobility or light recovery today.":"Middle ground \u2014 technical or moderate work, leave max effort for a green day.");
      wrapText(x, vtext, cx, cy+270, W-220, 38);

      // metrics row (6 metrics, two rows of 3 for room)
      var metrics=[
        ["HRV", today.hrv!=null?String(Math.round(today.hrv)):"\u2014", C.hrv],
        ["Rest HR", today.rhr!=null?String(today.rhr):"\u2014", C.ink],
        ["Subjective", today.hp_subjective!=null?(today.hp_subjective+"/10"):"\u2014", C.amber],
        ["Oura ready", today.o_readiness!=null?String(today.o_readiness):"\u2014", C.green],
        ["Oura sleep", today.o_sleepscore!=null?String(today.o_sleepscore):"\u2014", C.green],
        ["Sleep hrs", today.o_sleephrs!=null?(today.o_sleephrs.toFixed(1)):"\u2014", C.hrv]
      ];
      var my=topBlock-120, gap=20, perRow=3, cardW=(W-70*2-(perRow-1)*gap)/perRow, mh=90;
      for(var i=0;i<metrics.length;i++){
        var rowi=Math.floor(i/perRow), coli=i%perRow;
        var mcx=70+coli*(cardW+gap), mcy=my+rowi*(mh+gap);
        roundRect(x,mcx,mcy,cardW,mh,16); x.fillStyle=C.panel; x.fill();
        x.strokeStyle=C.line; x.lineWidth=1.5; roundRect(x,mcx,mcy,cardW,mh,16); x.stroke();
        x.textAlign="left";
        x.fillStyle=C.muted; x.font="500 18px 'IBM Plex Mono', monospace"; x.fillText(metrics[i][0].toUpperCase(), mcx+18, mcy+34);
        x.fillStyle=metrics[i][2]; x.font="700 40px Inter, Arial, sans-serif"; x.fillText(metrics[i][1], mcx+18, mcy+74);
      }

      // ---- WHY breakdown ----
      var wy=topBlock+metricsBlock-70;
      x.textAlign="left";
      x.fillStyle=C.ink; x.font="600 34px Fraunces, Georgia, serif"; x.fillText("Why this score", 70, wy);
      wy+=reasonsHeaderH-34;
      for(var j=0;j<reasons.length;j++){
        var rr=reasons[j], rh=reasonHeights[j];
        var dcol=(rr.dir==="up"?C.green:rr.dir==="down"?C.red:C.muted);

  // ===== FULL BACKUP: one dated JSON with EVERYTHING — local app data + all Supabase data.
  // A complete frozen snapshot you can save anywhere (Files, iCloud, email to yourself).
  // Tap it today → readiness-backup-2026-07-25.json; next month → a fresh dated file.
  // Keep as many as you like = versioned backups without any heavy machinery.
  async function backupEverything(model){
    var statusBtn=arguments[1]||null;
    try{
      if(statusBtn) statusBtn.textContent="Backing up\u2026";
      var stamp=new Date().toISOString().slice(0,10);
      var snap={
        _type:"readiness-full-backup",
        _version:1,
        _created:new Date().toISOString(),
        _note:"Complete snapshot. Local app data + team database. Import-ready.",
        local:{
          rows360:getJSON(K_ROWS,null),          // your imported 360HP CSV data
          ouraCache:getJSON(K_OURA,null),          // last Oura pull
          flags:getJSON(K_FLAGHIST,{}),            // tournament / travel per day
          notes:getJSON(K_NOTES,{}),               // your own per-day notes
          logHist:getJSON(K_LOGHIST,[]),           // sessions logged in-app (+velocities)
          gymCache:getJSON(K_GYM,null)             // cached programme
        },
        computed:{
          // the scored model — every day's score/band/why, so the snapshot is readable
          days:(model||[]).filter(function(d){return d.has;}).map(function(d){
            return { day:d.iso, score:d.score100, band:d.band, hrv:d.hrv, hrv_base:d.hBase,
              rhr:d.rhr, rhr_base:d.rBase, sleep_hours:d.o_sleephrs, sleep_score:d.o_sleepscore,
              subjective:d.hp_subjective, temp_dev:d.o_tempdev, tournament:d.tourn, travel:d.travel,
              reasons:(d.reasons||[]).map(function(r){return r.txt;}) };
          })
        },
        team:{ daily_readiness:[], session_notes:[], gym_logs:[], team_members:[] }
      };

      // pull the team database too (so notes + gym logs from the whole staff are captured)
      if(_teamSB){
        try{
          var s=await _teamSB.auth.getSession();
          if(s.data.session){
            var a=await _teamSB.from("daily_readiness").select("*").order("day",{ascending:true});
            snap.team.daily_readiness=a.data||[];
            var b=await _teamSB.from("session_notes").select("*").order("created_at",{ascending:false});
            snap.team.session_notes=b.data||[];
            var c=await _teamSB.from("gym_logs").select("*").order("created_at",{ascending:false});
            snap.team.gym_logs=c.data||[];
            var e=await _teamSB.from("team_members").select("email,full_name,role,active");
            snap.team.team_members=e.data||[];
          }
        }catch(te){ snap.team._error="Couldn't reach the team database (are you signed in?): "+te.message; }
      } else {
        snap.team._note="Team sync not configured on this device — local data only.";
      }

      var json=JSON.stringify(snap,null,2);
      var name="readiness-backup-"+stamp+".json";
      var blob=new Blob([json],{type:"application/json;charset=utf-8;"});
      var url=URL.createObjectURL(blob);
      var a2=document.createElement("a");a2.href=url;a2.download=name;
      document.body.appendChild(a2);a2.click();
      setTimeout(function(){ URL.revokeObjectURL(url); if(a2.parentNode)a2.parentNode.removeChild(a2); },1500);
      showExportText(json,name); // same iOS copy-fallback overlay
      if(statusBtn) statusBtn.textContent="Backed up \u2713";
    }catch(err){
      if(statusBtn) statusBtn.textContent="Back up everything";
      alert("Backup failed: "+err.message);
    }
  }

    else if(TAB==="oura") buildOura(body,fmodel);
    else if(TAB==="gymtrends") buildGymTrends(body);
    else if(TAB==="hp360") buildHP360(body,fmodel);
    else if(TAB==="insights") buildInsights(body,fmodel);

    var foot=document.createElement("div");foot.className="foot";
    foot.textContent="Signal, not diagnosis. This fuses trends across your own data to suggest how hard to go \u2014 it doesn't replace how you actually feel or medical advice. When your two sources disagree, it tells you and leans cautious.";
    app.appendChild(foot);
    // Scroll behaviour: jump to top only when the tab actually changes.
    // For in-tab re-renders (expanding a history day, dropdowns, toggles) keep position.
    if(typeof window!=="undefined"&&window.scrollTo){
      if(PREVTAB!==TAB){ window.scrollTo(0,0); }
      else { window.scrollTo(0,keepScroll); }
    }
    PREVTAB=TAB;
  }

  // initial render, then auto-sync Oura once on load if we have a URL
  try{
    if(teamConfigured()){
      // Resolve auth BEFORE first paint so signed-in users (owner or viewer) skip the login gate,
      // and only genuine not-signed-in team members see it.
      teamRefreshUser().then(function(){
        if(isViewer()){
          loadViewerData().then(function(){ render(false); });
        } else {
          render(false);
          if(_teamUser){ try{ syncToTeam(analyze(fuse())); }catch(e){} }
          if(!isViewer() && WORKER_URL && WORKER_URL.indexOf("http")===0){
            ouraStatus={state:"loading",msg:""};
            fetchOura(function(res){ ouraStatus=res.ok?{state:"ok",msg:""}:{state:"err",msg:res.error||"failed"}; render(false); });
          }
        }
      }).catch(function(){ render(false); });
      // keep in step with auth changes — but ONLY on real sign-in/out, NOT on the routine
      // token refresh that fires every time you return to the app (that was wiping typed inputs).
      if(_teamSB && _teamSB.auth && _teamSB.auth.onAuthStateChange){
        var _lastUid = _teamUser ? _teamUser.id : null;
        _teamSB.auth.onAuthStateChange(function(event, session){
          if(event==="TOKEN_REFRESHED" || event==="INITIAL_SESSION") return; // no re-render on these
          var newUid = session && session.user ? session.user.id : null;
          if(newUid === _lastUid) return; // same user — nothing changed, don't rebuild
          _lastUid = newUid;
          // snapshot any in-progress training entry before we rebuild
          try{ snapshotTrainingNow(); }catch(e){}
          teamRefreshUser().then(function(){
            if(isViewer()){ loadViewerData().then(function(){ render(false); }); }
            else { render(false); }
          });
        });
      }
    } else {
      // no team configured — just the owner's local app
      render(false);
      if(WORKER_URL && WORKER_URL.indexOf("http")===0){
        ouraStatus={state:"loading",msg:""};
        fetchOura(function(res){ ouraStatus=res.ok?{state:"ok",msg:""}:{state:"err",msg:res.error||"failed"}; render(false); });
      }
    }
  }catch(err){ fail("Something went wrong starting the app: "+err.message); }
})();
</script>
</body>
</html>
